<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#F8FAFC"/>

  <!-- Titel -->
  <text x="60" y="56" font-size="11" letter-spacing="2.5" fill="#94A3B8" font-weight="600">PAPIERKRAM-ORAKEL · LOCAL RAG PIPELINE</text>
  <text x="60" y="90" font-size="26" font-weight="700" fill="#0F172A">From paper stack to cited answer</text>

  <!-- ===================== Phase 1: Indexierung ===================== -->
  <rect x="44" y="116" width="1112" height="196" rx="16" fill="#F1F5F9"/>
  <circle cx="76" cy="148" r="12" fill="#4F46E5"/>
  <text x="76" y="152.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="96" y="153" font-size="13"><tspan font-weight="700" fill="#0F172A">Indexing</tspan><tspan fill="#64748B"> · once per knowledge domain</tspan></text>
  <rect x="1032" y="134" width="104" height="26" rx="13" fill="none" stroke="#4F46E5" stroke-width="1"/>
  <text x="1084" y="151" font-size="12" fill="#4F46E5" text-anchor="middle">100 % local</text>

  <!-- Box 1: Dokumente -->
  <rect x="68" y="176" width="192" height="112" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="84" y="210" font-size="20">📄</text>
  <text x="84" y="238" font-size="15" font-weight="600" fill="#0F172A">Documents</text>
  <text x="84" y="258" font-size="11.5" fill="#64748B">PDF · DOCX · MD · TXT</text>
  <text x="84" y="274" font-size="11.5" fill="#64748B">scans · phone photos</text>

  <!-- Box 2: Parsing -->
  <rect x="288" y="176" width="192" height="112" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="304" y="210" font-size="20">🔍</text>
  <text x="304" y="238" font-size="15" font-weight="600" fill="#0F172A">Parsing &amp; OCR</text>
  <text x="304" y="258" font-size="11.5" fill="#64748B">extract text + source location,</text>
  <text x="304" y="274" font-size="11.5" fill="#64748B">Tesseract OCR for scans</text>

  <!-- Box 3: Chunking -->
  <rect x="508" y="176" width="192" height="112" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="524" y="210" font-size="20">✂️</text>
  <text x="524" y="238" font-size="15" font-weight="600" fill="#0F172A">Chunking</text>
  <text x="524" y="258" font-size="11.5" fill="#64748B">paragraphs into ~700-char</text>
  <text x="524" y="274" font-size="11.5" fill="#64748B">chunks, 10 % overlap</text>

  <!-- Box 4: Embedding -->
  <rect x="728" y="176" width="192" height="112" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="744" y="210" font-size="20">🧮</text>
  <text x="744" y="238" font-size="15" font-weight="600" fill="#0F172A">Embedding</text>
  <text x="744" y="258" font-size="11.5" fill="#64748B">meaning → 384-dim vector,</text>
  <text x="744" y="274" font-size="11.5" fill="#64748B">local MiniLM model</text>

  <!-- Box 5: SQLite -->
  <rect x="948" y="176" width="192" height="112" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="964" y="210" font-size="20">🗄️</text>
  <text x="964" y="238" font-size="15" font-weight="600" fill="#0F172A">SQLite index</text>
  <text x="964" y="258" font-size="11.5" fill="#64748B">vector + full-text index,</text>
  <text x="964" y="274" font-size="11.5" fill="#64748B">one file per knowledge domain</text>

  <!-- Pfeile Reihe 1 -->
  <line x1="262" y1="232" x2="282" y2="232" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="482" y1="232" x2="502" y2="232" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="702" y1="232" x2="722" y2="232" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="922" y1="232" x2="942" y2="232" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Verbindung Index -> Hybrid-Suche -->
  <path d="M1044 290 V324 H604 V388" fill="none" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="824" y="318" font-size="11" fill="#94A3B8" text-anchor="middle">searches the index</text>

  <!-- ===================== Phase 2: Abfrage ===================== -->
  <rect x="44" y="336" width="1112" height="196" rx="16" fill="#F1F5F9"/>
  <circle cx="76" cy="368" r="12" fill="#0284C7"/>
  <text x="76" y="372.5" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="96" y="373" font-size="13"><tspan font-weight="700" fill="#0F172A">Query</tspan><tspan fill="#64748B"> · on every question</tspan></text>

  <!-- Box 1: Frage -->
  <rect x="68" y="396" width="192" height="112" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="84" y="430" font-size="20">💬</text>
  <text x="84" y="458" font-size="15" font-weight="600" fill="#0F172A">Question</text>
  <text x="84" y="478" font-size="11.5" fill="#64748B">»Which wash program</text>
  <text x="84" y="494" font-size="11.5" fill="#64748B">for wool?«</text>

  <!-- Box 2: Embedding -->
  <rect x="288" y="396" width="192" height="112" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="304" y="430" font-size="20">🧮</text>
  <text x="304" y="458" font-size="15" font-weight="600" fill="#0F172A">Embedding</text>
  <text x="304" y="478" font-size="11.5" fill="#64748B">question → vector,</text>
  <text x="304" y="494" font-size="11.5" fill="#64748B">same model as the index</text>

  <!-- Box 3: Hybrid-Suche -->
  <rect x="508" y="396" width="192" height="112" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="524" y="430" font-size="20">🔀</text>
  <text x="524" y="458" font-size="15" font-weight="600" fill="#0F172A">Hybrid search</text>
  <text x="524" y="478" font-size="11.5" fill="#64748B">vector KNN + BM25 in parallel,</text>
  <text x="524" y="494" font-size="11.5" fill="#64748B">fused via RRF</text>

  <!-- Box 4: Reranking -->
  <rect x="728" y="396" width="192" height="112" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="744" y="430" font-size="20">🎯</text>
  <text x="744" y="458" font-size="15" font-weight="600" fill="#0F172A">Reranking</text>
  <text x="744" y="478" font-size="11.5" fill="#64748B">cross-encoder reads question +</text>
  <text x="744" y="494" font-size="11.5" fill="#64748B">chunk together, re-ranks</text>

  <!-- Box 5: Claude (Cloud) -->
  <rect x="948" y="396" width="192" height="112" rx="12" fill="#FFFFFF" stroke="#D97706"/>
  <rect x="1056" y="408" width="72" height="20" rx="10" fill="none" stroke="#D97706" stroke-width="1"/>
  <text x="1092" y="422" font-size="10.5" fill="#D97706" text-anchor="middle">Cloud</text>
  <text x="964" y="430" font-size="20">🤖</text>
  <text x="964" y="458" font-size="15" font-weight="600" fill="#0F172A">Claude (LLM)</text>
  <text x="964" y="478" font-size="11.5" fill="#64748B">writes the answer only</text>
  <text x="964" y="494" font-size="11.5" fill="#64748B">from retrieved passages</text>

  <!-- Pfeile Reihe 2 -->
  <line x1="262" y1="452" x2="282" y2="452" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="482" y1="452" x2="502" y2="452" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="702" y1="452" x2="722" y2="452" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="922" y1="452" x2="942" y2="452" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pfeil zur Antwort -->
  <line x1="1044" y1="512" x2="1044" y2="544" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Antwort-Karte -->
  <rect x="728" y="552" width="412" height="108" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="728" y="566" width="3" height="80" fill="#059669"/>
  <text x="752" y="580" font-size="10.5" letter-spacing="1.5" fill="#059669" font-weight="600">ANSWER WITH SOURCE REFERENCE</text>
  <text x="752" y="604" font-size="13" fill="#0F172A">Program 4 (wool/hand wash),</text>
  <text x="752" y="622" font-size="13" fill="#0F172A">30 °C, max. 600 rpm</text>
  <text x="752" y="646" font-size="11" fill="#059669" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace">[Source: bosch_wat28.md | wash programs]</text>

  <!-- Fußnote + Legende -->
  <text x="60" y="584" font-size="12.5" fill="#64748B">Search &amp; ranking run fully local without any LLM —</text>
  <text x="60" y="604" font-size="12.5" fill="#64748B">the language model only phrases the final answer from the retrieved passages.</text>
  <circle cx="66" cy="638" r="5" fill="#4F46E5"/>
  <text x="78" y="642" font-size="12" fill="#64748B">local &amp; free</text>
  <circle cx="196" cy="638" r="5" fill="#D97706"/>
  <text x="208" y="642" font-size="12" fill="#64748B">the only cloud step (Claude)</text>
</svg>
